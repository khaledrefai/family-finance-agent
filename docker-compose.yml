# One command runs the whole stack:  ./deploy.sh
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ffa
      POSTGRES_USER: ffa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffa -d ffa"]
      interval: 5s
      retries: 20

  core:
    build: ./core
    environment:
      SPRING_PROFILES_ACTIVE: demo          # loads the demo family
      DB_URL: jdbc:postgresql://db:5432/ffa
      DB_USER: ffa
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      SERPAPI_KEY: ${SERPAPI_KEY:-}         # web search for live prices; not read by any code yet
      # Week 5 notifications. All optional: without SMTP_HOST no email is sent; without VAPID keys the core
      # makes its own web push keys on first start and keeps them in the database.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PUSH_CONTACT: ${PUSH_CONTACT:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]  # bash: /bin/sh has no /dev/tcp
      interval: 5s
      retries: 30

  agents:
    build: ./agents
    environment:
      AGENTS_CORE_URL: http://core:8080
      AGENTS_LLM: ${AGENTS_LLM:-auto}
      AGENTS_LLM_MODEL: ${AGENTS_LLM_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
    depends_on:
      - core

  web:
    build:
      context: ./web
      args:
        CORE_URL: http://core:8080
        AGENTS_URL: http://agents:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - core
      - agents

  # HTTPS on the real domain. Only runs with COMPOSE_PROFILES=https and DOMAIN set in .env (the VPS deploy
  # does this); on your own computer it stays off and the app is on http://localhost:3000 as before.
  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data          # the certificates; kept so every deploy doesn't ask Let's Encrypt again
      - caddyconfig:/config
    depends_on:
      - web

volumes:
  dbdata:
  caddydata:
  caddyconfig:
