spring:
  application:
    name: family-finance-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ffa}
    username: ${DB_USER:ffa}
    password: ${DB_PASSWORD:ffa}
    hikari:
      # "Today" in SQL (current_date in the demo seed) must be the UAE day, like the core's clock (ClockConfig).
      # Without this the database uses the server's zone (UTC), and from midnight to 4 am UAE the two disagree.
      connection-init-sql: SET TIME ZONE 'Asia/Dubai'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks the entities match it
  flyway:
    locations: classpath:db/migration
  # Parent email alerts (week 5). Off unless SMTP_HOST is set. Port 587 uses STARTTLS; for port 465 set SMTP_SSL=true.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB      # receipts and statements (DocumentService.MAX_BYTES)
      max-request-size: 6MB

app:
  jwt:
    # DEV ONLY default. Set APP_JWT_SECRET (32+ random bytes) anywhere that is not your laptop.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: family-finance-core
    ttl: 8h
  # Where the app is opened, for the link in alert emails, e.g. https://family.example.com (optional)
  public-url: ${APP_PUBLIC_URL:}
  mail:
    from: ${MAIL_FROM:}
  push:
    # Optional. Empty = the core makes a key pair on first start and keeps it in the database (app_setting).
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    # How push services can reach whoever runs this server: mailto:you@example.com or an https address
    subject: ${PUSH_CONTACT:}
  # Price search (week 6). live = 24 h cache, then SerpApi, then the saved price list; cache = cache (any age), then the
  # saved list (record the demo this way after ops/prewarm-prices.sh); off = the saved list only.
  pricing:
    search-live: ${SEARCH_LIVE:live}
    serpapi-key: ${SERPAPI_KEY:}
    timeout: 6s
    cache-for: 24h
    # Each comparison re-checks its top offers with one narrower search each. 0 = no re-check (saves searches).
    verify-top: ${PRICE_VERIFY_TOP:3}

management:
  health:
    mail:
      enabled: false   # email is optional; a missing SMTP server must not mark the core as down
  endpoints:
    web:
      exposure:
        include: health

---
# "demo" profile: also loads the demo family (db/seed). Used by docker-compose and the tests.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed
